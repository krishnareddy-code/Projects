<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - DevOps Training</title>
    <style>
        body { 
            font-family: -apple-system, Arial, sans-serif; 
            background: #f0f4f8;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 480px; 
            text-align: center;
        }
        h1 { 
            color: #2c3e50; 
            margin-top: 0; 
            font-size: 26px;
        }
        .welcome-msg {
            color: #34495e;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 25px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .grid-item {
            background: #f8fafd;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .symbol {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .label {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
        }
        .user-highlight {
            color: #2ecc71;
            font-weight: bold;
        }
        .btn-logout { 
            display: inline-block;
            text-decoration: none;
            width: 100%; 
            padding: 12px; 
            background: #e74c3c; 
            color: white;
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 25px; 
            box-sizing: border-box;
        }
        .btn-logout:hover { 
            background: #c0392b; 
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome {{ username }}!</h1>
    
    <div class="welcome-msg">
        Welcome to the DevOps Training
    </div>
    
    <!-- DevOps Flow Visual Grid -->
    <div class="dashboard-grid">
        <div class="grid-item">
            <span class="symbol" style="color: #3498db;">🔄</span>
            <span class="label">CI/CD Pipeline</span>
        </div>
        <div class="grid-item">
            <span class="symbol" style="color: #9b59b6;">☁️</span>
            <span class="label">Cloud Infrastructure</span>
        </div>
        <div class="grid-item">
            <span class="symbol" style="color: #e67e22;">📊</span>
            <span class="label">Monitoring & Metrics</span>
        </div>
        <div class="grid-item">
            <span class="symbol" style="color: #e74c3c;">🚀</span>
            <span class="label">Deployment Rocket</span>
        </div>
    </div>
    
    <a href="{{ url_for('logout') }}" class="btn-logout">Sign Out</a>
</div>

</body>
</html>
