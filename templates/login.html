<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DevOps Training</title>
    <style>
        body { 
            font-family: -apple-system, Arial, sans-serif; 
            background: #f0f4f8;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 320px; 
        }
        h1 { 
            color: #2c3e50; 
            text-align: center; 
            margin-top: 0; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0; 
            box-sizing: border-box; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px; 
        } 
        button { 
            width: 100%; 
            padding: 12px; 
            background: #3498db; 
            color: white;
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        button:hover { 
            background: #2980b9; 
        }
        .error { 
            color: #e74c3c; 
            background-color: #fadbd8;
            padding: 8px;
            border-radius: 6px;
            text-align: center; 
            margin-bottom: 10px; 
            font-size: 13px; 
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Login</h1>
    
    <!-- Flask flash messages engine -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="error">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</div>

</body>
</html>
